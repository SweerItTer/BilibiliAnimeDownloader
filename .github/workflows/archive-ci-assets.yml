name: Archive CI assets

on:
  workflow_run:
    workflows: [CLI package checks, Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful completed workflow run to archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: archive-ci-assets-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  archive:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      packages: write
    steps:
      - name: Checkout trusted default-branch archive implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned OCI artifact client
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: '1.3.0'
      - name: Persist and verify internal inputs before removing Actions copies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python scripts/ci/archive_assets.py --repository "$GITHUB_REPOSITORY" --run-id "$SOURCE_RUN_ID"
